[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metafusion-knight"
version = "0.1.0"
description = "Reproducible B.Tech research pipeline for Kidney Tumor Risk Classification (KNIGHT + MetaFusion)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
